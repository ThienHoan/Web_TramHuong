name: Build and Deploy to VPS

# Push to main = deploy to production. "Run workflow" on the Actions tab redeploys by hand.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      # Only the PUBLIC website settings (NEXT_PUBLIC_*) are needed to build. The
      # backend secrets in ENV_FILE are never exported to the build steps.
      - name: Read public build settings
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # ENV_FILE may be base64 (recommended) or pasted as plain text.
          if ! printf '%s' "$ENV_FILE" | base64 -d > /tmp/app.env 2>/dev/null || ! grep -q '=' /tmp/app.env; then
            printf '%s\n' "$ENV_FILE" > /tmp/app.env
            echo "::warning::ENV_FILE is not base64; reading it as plain text"
          fi
          # Tolerates CRLF line endings, "export ", spaces around "=" and quotes.
          python3 - > /tmp/public.env <<'PY'
          import re
          found = {}
          for line in open('/tmp/app.env', encoding='utf-8-sig', errors='replace'):
              m = re.match(r'\s*(?:export\s+)?(NEXT_PUBLIC_[A-Z0-9_]+)\s*=\s*(.*?)\s*$', line.rstrip('\r\n'))
              if not m:
                  continue
              value = m.group(2)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in '"\'':
                  value = value[1:-1]
              found[m.group(1)] = value
          # New Supabase naming: a publishable key works as the anon key.
          if not found.get('NEXT_PUBLIC_SUPABASE_ANON_KEY') and found.get('NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'):
              found['NEXT_PUBLIC_SUPABASE_ANON_KEY'] = found['NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY']
          # NEXT_PUBLIC_* values are shipped to every visitor's browser: refuse secrets.
          import base64, json, sys
          def is_secret(value):
              if 'sb_secret_' in value:
                  return True
              parts = value.split('.')
              if len(parts) == 3 and value.startswith('eyJ'):
                  try:
                      claims = json.loads(base64.urlsafe_b64decode(parts[1] + '=' * (-len(parts[1]) % 4)))
                      return claims.get('role') == 'service_role'
                  except Exception:
                      return False
              return False
          problems = [n for n, v in found.items() if is_secret(v)]
          url = found.get('NEXT_PUBLIC_SUPABASE_URL', '')
          if url and not re.fullmatch(r'https://[a-z0-9]{20}\.supabase\.co/?', url):
              problems.append('NEXT_PUBLIC_SUPABASE_URL (must look like https://<20-letter project id>.supabase.co)')
          if problems:
              print('::error::Unsafe or malformed public settings: ' + ', '.join(problems), file=sys.stderr)
              sys.exit(3)
          for name, value in found.items():
              print(f'{name}={value}')
          PY
          rm -f /tmp/app.env
          missing=""
          for v in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            grep -q "^$v=." /tmp/public.env || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::ENV_FILE is missing or has an empty value for:$missing"
            echo "Public names found (values hidden): $(cut -d= -f1 /tmp/public.env | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/public.env >> "$GITHUB_ENV"
          rm -f /tmp/public.env

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tramhuong-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/tramhuong-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tramhuong-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/tramhuong-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_DP_ID=${{ env.NEXT_PUBLIC_DP_ID }}
            NEXT_PUBLIC_SEPAY_ACCOUNT_NUMBER=${{ env.NEXT_PUBLIC_SEPAY_ACCOUNT_NUMBER }}
            NEXT_PUBLIC_BANK_CODE=${{ env.NEXT_PUBLIC_BANK_CODE }}
            NEXT_PUBLIC_BANK_ACC=${{ env.NEXT_PUBLIC_BANK_ACC }}
            NEXT_PUBLIC_BANK_NAME=${{ env.NEXT_PUBLIC_BANK_NAME }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code (for compose and Caddy files)
        uses: actions/checkout@v4

      - name: Copy compose and Caddy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/tramhuong-deploy"

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: ENV_FILE
          script: |
            set -e
            cd ~/tramhuong-deploy

            # Backend settings and secrets: readable by this user only.
            # ENV_FILE may be base64 (recommended) or plain text; strip Windows line endings.
            umask 077
            if ! printf '%s' "$ENV_FILE" | base64 -d > .env 2>/dev/null || ! grep -q '=' .env; then
              printf '%s\n' "$ENV_FILE" > .env
            fi
            sed -i 's/\r$//' .env

            # Values used only to fill in docker-compose.prod.yml.
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            printf 'OWNER=%s\nTAG=%s\nDOMAIN=%s\n' "$OWNER_LC" "${{ github.sha }}" "${{ vars.DOMAIN || secrets.DOMAIN }}" > deploy.env
            grep -q '^DOMAIN=.' deploy.env || { echo "Set DOMAIN (Settings > Secrets and variables > Actions > Variables), e.g. example.com"; exit 1; }

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --env-file deploy.env -f docker-compose.prod.yml pull
            docker compose --env-file deploy.env -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io

            # Fail the deploy if the API does not answer within ~60 seconds.
            for i in $(seq 1 20); do
              if docker compose --env-file deploy.env -f docker-compose.prod.yml exec -T api \
                   wget -qO- http://127.0.0.1:4000/api >/dev/null 2>&1; then
                echo "API is up (version ${{ github.sha }})"; break
              fi
              [ "$i" = 20 ] && { echo "API did not start"; docker compose --env-file deploy.env -f docker-compose.prod.yml logs --tail 50 api; exit 1; }
              sleep 3
            done

            docker image prune -f
