packages:
  - .
allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  msw: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
dangerouslyAllowAllBuilds: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Keep synchronized with package.json for pnpm 9 used in Docker.
overrides:
  'ws@^8': '^8.21.0'
  'browserslist@^4': '^4.28.7'
  'baseline-browser-mapping@^2': '^2.11.0'
  '@babel/core@^7': '^7.29.1'
  # Next bundles its own sharp ^0.35, whose Alpine x64 binary needs x86-64-v2; the VPS CPU
  # lacks it, so the image optimizer silently served full-size originals. Same pin as the API.
  sharp: '0.34.5'
